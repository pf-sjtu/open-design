packages:
  - packages/*
  - apps/*
  - tools/*
  - shells/*
  - e2e

overrides:
  brace-expansion: 5.0.6
  devalue: 5.8.1
  fast-uri: 3.1.2
  hono: 4.12.19
  ip-address: 10.2.0
  postcss: 8.5.15
  protobufjs: 8.4.0
  qs: 6.15.2
  tmp: 0.2.7
  yaml: 2.9.0

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp

# Cross-architecture packaging: `tools-pack win build --arch <arch>` must be able
# to assemble a payload for an architecture other than the build host (this fork
# builds Windows ARM64 on an ARM64 host and keeps win-x64 working). Without this,
# pnpm installs only the host arch's optional variants and packaging then fails
# on a missing `@img/sharp-win32-<arch>` / `@next/swc-win32-<arch>` tree.
supportedArchitectures:
  os:
    - win32
    - darwin
    - linux
  cpu:
    - arm64
    - x64
